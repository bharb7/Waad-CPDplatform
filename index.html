    ["Learners show no engagement at the start, with no evidence of connection to prior learning or the lesson focus.","Some learners show engagement, though links to prior knowledge or purpose remain unclear or inconsistent.","Most learners recall relevant prior knowledge and demonstrate initial curiosity towards the lesson topic.","The majority of learners activate prior knowledge consciously and pose purposeful questions that reflect active engagement.","Learners independently activate implicit prior knowledge and generate extended hypotheses that demonstrate depth of understanding and autonomy."],
    ["Learners struggle to establish any connection between learning and real-life or authentic contexts.","Some learners attempt to make connections, but these remain superficial or overly general when prompted.","Most learners recognise connections and provide limited examples from personal experience.","Learners establish clear and conscious links between content and a range of authentic or cross-curricular contexts.","Learners initiate unfamiliar connections and apply learning in complex and entirely new situations."],
    ["Learners struggle to identify lesson objectives or the success criteria expected of them.","Some learners repeat objectives mechanically, showing limited understanding of what is required to be achieved.","Most learners can express the objectives in their own words and demonstrate a basic understanding of success criteria.","Learners use success criteria to guide learning and evaluate progress regularly.","Learners take responsibility for achieving learning goals and formulate personal objectives that go beyond general expectations."],
    ["Learners finish the lesson without providing any clear evidence of understanding or mastery of the outcomes.","Learners provide partial or superficial answers that do not reflect genuine mastery of the core concepts.","Most learners successfully complete a basic final task, though some minor misconceptions remain.","Learners provide clear and strong evidence of mastery through progressively deeper final tasks.","Learners demonstrate ownership of their learning and continuous self-correction, showing full mastery of the outcomes."]
  ],
  d2:[
    ["Learners lack awareness of identity or appreciation of cultures, with an absence of respect in classroom interactions.","Some learners show limited respect or superficial cultural awareness, requiring continuous guidance.","Most learners express a basic sense of belonging and demonstrate general respect and appreciation for cultural diversity.","Learners express their identity confidently and show a deep appreciation of different cultures in their discussions.","Learners demonstrate pride in their identity and lead respectful, mindful discussions about global cultural diversity."],
    ["Learners are absent from active participation and show a complete lack of engagement in activities.","Some learners participate intermittently or superficially, relying entirely on external guidance.","Most learners participate in a basic and consistent manner, with a stable initial motivation toward learning.","Learners participate actively and continuously, showing clear initiative in all activities.","Learners lead their own learning with intrinsic enthusiasm and positively influence the engagement and motivation of their peers."],
    ["Learners' behavior is disruptive to learning, with a lack of awareness of responsibility or rules.","Learners' behavior fluctuates between compliance and distraction, requiring constant external reminders.","Most learners demonstrate acceptable and disciplined behavior, with a basic awareness of classroom responsibility.","Learners show positive, self-driven discipline and take conscious responsibility for their behavior.","Learners self-regulate and contribute effectively to creating a positive and motivating learning environment."]
  ],
  d3:[
    ["Assessment criteria remain unknown or unclear to learners throughout the learning process.","Some learners are aware of the assessment criteria when they are pointed out by the teacher.","Most learners clearly understand the assessment criteria and can explain them in a simple way.","The majority of learners fully understand what is being assessed and how to achieve the required outcomes with precision.","All learners fully understand what is expected of them within the context of their own learning."],
    ["Learners receive information passively without being engaged in self-checking of their understanding.","Some learners ask limited questions or provide superficial responses to check understanding.","Most learners ask basic questions and provide direct responses that reflect an initial level of understanding.","Learners ask progressively deeper questions and refine their understanding based on feedback.","Learners ask extended and critical questions and continuously engage in self-correction of their understanding processes."],
    ["Learners have no role in evaluating their own work or that of their peers and remain passive recipients of assessment.","Some learners participate in evaluating the quality of their own work or that of others in a superficial or inconsistent manner.","Most learners participate in evaluating the success of their work and their peers' work using simple criteria.","Learners set their own goals based on the results of their self- and peer-assessment with awareness.","Learners use assessment criteria skillfully and independently to continuously improve their own performance and that of their peers."],
    ["Learners show no response to feedback or demonstrate a lack of interest in suggested improvements.","Some learners respond to general feedback or simple praise without a clear impact on their performance.","Most learners apply improvement suggestions resulting from useful feedback and specific praise.","Learners respond effectively to targeted praise and precise feedback, which is reflected in the quality of their work.","Learners develop their performance exceptionally based on highly personalized and very specific feedback."],
    ["Learners lack any awareness of their personal performance goals or their progress toward outcomes.","Some learners show partial awareness of their performance goals when asked directly.","Most learners clearly understand their performance goals and show initial motivation to achieve them.","60% of learners clearly explain what they need to improve to make greater personal progress.","75% of learners explain ways to improve their performance skillfully, with full awareness of their personal progress trajectory."]
  ],
  d4:[
    ["Learners receive information passively without using questioning or inquiry to construct meaning.","Some learners participate in simple discussions or ask limited clarifying questions.","Most learners engage in inquiry activities and ask questions that support basic understanding.","Learners engage in probing questioning and active inquiry to achieve deep understanding.","Learners provide analytical and critical responses and independently lead inquiry and research processes."],
    ["Learners interact individually and in isolation, without any shared knowledge construction or dialogue.","Learners collaborate in a superficial or uneven manner, with limited communication in group tasks.","Most learners collaborate functionally and productively, exchanging basic ideas and building knowledge.","Learners collaborate effectively and systematically through dialogue based on mutual respect.","Learners lead collaborative dialogue and skillfully use each other as additional learning resources."],
    ["Learners engage only in passive and purely theoretical tasks, without any practical or experimental application.","Learners apply knowledge in a limited or intermittent manner in simple practical activities that lack depth.","Most learners apply knowledge directly in experimental activities that support basic understanding of the content.","Learners apply their knowledge in authentic contexts and solve real-world problems through active engagement.","Learners transfer their learning to new and complex contexts, demonstrating creativity in practical application."],
    ["Learners lack the ability to reflect on their learning or awareness of how knowledge is acquired.","Some learners engage in superficial or occasional reflection on their learning only when prompted directly.","Most learners reflect at a basic level and are aware of some learning strategies used.","Learners reflect consciously and use specific strategies to improve the quality of their future learning.","Learners reflect deeply and continuously adjust their strategies independently to achieve full mastery."]
  ],
  d5:[
    ["Some learners are unable to participate due to the lack of support.","Some learners feel partial safety to participate however opportunities remain unequal for all.","Most learners feel safe and confident, participating effectively in a supportive classroom environment.","All learners feel completely safe, with fair and equal opportunities for participation and success.","All learners experience genuine belonging and view mistakes as learning opportunities within a fully inclusive environment."],
    ["Learners remain passive and overly dependent on external guidance at every step.","Some learners show limited ownership or occasional independence during certain stages of the lesson.","Most learners work independently and effectively on assigned tasks, taking responsibility.","Learners consciously choose their activities and take responsibility for their individual and group learning seriously.","Learners lead their own learning completely independently and set their personal goals with awareness and competence."],
    ["Learners use digital tools in a limited or unfocused way that does not support the learning process.","Learners use digital tools partially, serving presentation more than deepening understanding.","Most learners use digital tools functionally to support basic understanding of the content.","Learners enhance their understanding and engagement through purposeful and consistent use of digital tools.","Learners transform their learning experiences and enhance collaboration and independence through innovative digital integration."],
    ["All learners receive the same learning without any differentiated support that considers their individual differences.","Some learners receive limited support or partial, inconsistent differentiation in tasks.","Most learners receive gradual support and basic differentiation that addresses their diverse needs.","Learners receive flexible and differentiated support that effectively responds to their varied needs.","All learners progress toward mastery thanks to receiving personalized support and differentiated challenges."]
  ]
};

async function saveSchoolSettings(retrying){
  sset('roleCfg',S.roleCfg);sset('mechM',S.mechM);sset('dhM',S.dhM);sset('branding',S.branding);sset('customDomains',S.customDomains);sset('schedCats',S.schedCats);sset('deletedSeedUsers',S.deletedSeedUsers);
  if(!SCHOOL_ID)return true;
  // Include online_users/activity_log so this PATCH (which replaces the whole `branding`
  // JSON column) doesn't silently wipe them out every time a setting like Schedule
  // Categories is saved.
  const payload={branding:{name:S.branding.name||'Waad Academy',logo:S.branding.logo||'',partners:S.branding.partners||[],
    online_users:S.branding.online_users||{},activity_log:S.branding.activity_log||[],
    roleCfg:S.roleCfg,customDomains:S.customDomains||null,schedCats:S.schedCats||null,
    deletedSeedUsers:S.deletedSeedUsers||DEFAULT_DELETED_SEED_USERS},mech_overrides:S.mechM,dh_overrides:S.dhM};
  try{
    // IMPORTANT: 'Prefer: return=minimal' used to hide a real bug here — PostgREST returns
    // HTTP 200/204 "success" even when an RLS UPDATE policy on `schools` silently blocks the
    // write and 0 rows actually change (same class of bug already found & fixed in sbDelete).
    // That's the most likely reason ticking Role Permissions "stopped working": the app said
    // "updated ✓" but nothing actually reached the database. return=representation lets us see
    // the real row count and catch this instead of lying to the user.
    const r=await fetch(SB_URL+'/rest/v1/schools?id=eq.'+SCHOOL_ID,{method:'PATCH',headers:{...SB_HEADERS,'Prefer':'return=representation'},body:JSON.stringify(payload),cache:'no-store'});
    if(!r.ok){
      const e=await r.text();
      console.warn('saveSchoolSettings failed',r.status,e);
      // These settings (Schedule Categories, Role Permissions, etc.) are shared by the whole
      // school, so a silent failure here is exactly why "categories don't appear for everyone".
      // Auto-retry once before bothering the user with an error.
      if(!retrying)return saveSchoolSettings(true);
      showToast('Saved on this device, but the server update failed ('+r.status+') — it may not show up after a refresh or on another device.','error');
      return false;
    }
    let body=[];
    try{body=await r.json();}catch(_e){}
    if(Array.isArray(body)&&body.length===0){
      console.warn('saveSchoolSettings: 0 rows updated — likely blocked by an RLS UPDATE policy on `schools`');
      if(!retrying)return saveSchoolSettings(true);
      showToast('Saved on this device only — the database rejected the update (0 rows changed, most likely a Row-Level-Security permissions issue on the "schools" table in Supabase). Other users will NOT see this change until that is fixed. Ask your developer to check the UPDATE policy on schools.','error');
      return false;
    }
    if(retrying)showToast('Synced to the database ✓ (took a retry)');
    return true;
  }catch(e){
    console.warn('saveSchoolSettings failed',e);
    if(!retrying)return saveSchoolSettings(true);
    showToast('Saved on this device, but could not reach the server — it may not show up after a refresh or on another device.','error');
    return false;
  }
}

// ── Safe role-permission updates (fixes the real root cause of permissions "resetting") ────
// schools.branding.roleCfg is ONE shared JSON blob holding every role's permissions. Every save
// used to PATCH the whole blob using whatever S.roleCfg this particular browser tab happened to
// have in memory. With several tabs/devices open (very normal while testing — Bilal's laptop,
// Junaid's device, a previous tab left open, the 30s live-permission poll, etc.) an older tab's
// snapshot can silently overwrite a newer change made elsewhere: a classic "lost update" race.
// That's why CPD Lead permissions were losing views unpredictably even though each individual
// save reported success — the write itself worked, it just overwrote something newer.
// Fix: always re-fetch the CURRENT server copy of roleCfg immediately before writing, apply only
// the one change being made right now on top of that fresh copy, then save. Works the same way
// for every role (not just CPD Lead) and for creating, editing, or deleting a role.
async function updateRoleCfg(mutatorFn){
  let base={...S.roleCfg};
  if(SCHOOL_ID){
    const fresh=await sbGet('schools','id=eq.'+SCHOOL_ID+'&select=branding&limit=1');
    if(fresh&&fresh[0]&&fresh[0].branding&&fresh[0].branding.roleCfg){
      base={...DEFAULT_ROLES,...fresh[0].branding.roleCfg};
    }
  }
  S.roleCfg=mutatorFn(base);
  return await save('roleCfg',S.roleCfg);
}
// Same read-fresh-merge-write pattern as updateRoleCfg, for the deletedSeedUsers tombstone list
// (also stored in the shared branding blob) — so deleting a seed user on one device can't be
// silently undone by a stale save from another tab.
async function updateDeletedSeedUsers(mutatorFn){
  let base=[...(S.deletedSeedUsers||DEFAULT_DELETED_SEED_USERS)];
  if(SCHOOL_ID){
    const fresh=await sbGet('schools','id=eq.'+SCHOOL_ID+'&select=branding&limit=1');
    if(fresh&&fresh[0]&&fresh[0].branding&&fresh[0].branding.deletedSeedUsers){
      base=[...new Set([...DEFAULT_DELETED_SEED_USERS,...fresh[0].branding.deletedSeedUsers])];
    }
  }
  S.deletedSeedUsers=mutatorFn(base);
  return await save('deletedSeedUsers',S.deletedSeedUsers);
}

  // saveSchoolSettings() actually reached the database — so Role Permission edits could show
  // "updated ✓" even when the write silently failed. Now the real result is propagated.
  if(['roleCfg','mechM','dhM','branding','customDomains','schedCats','deletedSeedUsers'].includes(k)){return await saveSchoolSettings();}
  if(!SCHOOL_ID)return true;
  const sid=SCHOOL_ID;
  try{
    // Switched to resilient upsert: after finding public.users targeting several columns that
    // didn't actually exist (see mapUser), grades on teachers isn't assumed safe either — if that
    // column is still missing when this runs, the rest of the teacher's data (name/dept/section/
    // stage) now still saves instead of the WHOLE row silently failing.
    if(k==='teachers') return await sbUpsertResilient('teachers',v.map(t=>({id:t.id,school_id:sid,name:t.name,dept:t.dept||'',section:t.section||'',stage:t.stage||'',grades:t.grades||[],group_id:t.groupId||null})),['grades']);

    // role_key (not "role") is the real column name on public.users. username/password/sections/
    // teacher_id/grades are optional — they only exist after the ALTER TABLE statements shipped
    // with this round are run; sbUpsertResilient retries without them if they're still missing,
    // so saves keep working (minus those specific fields) even before that SQL has been applied.
    else if(k==='users') return await sbUpsertResilient('users',v.map(u=>({id:u.id,school_id:sid,name:u.name||u.fullName||'',role_key:u.role||'viewer',depts:u.depts||[],username:u.username||'',password:u.password||'',sections:u.sections||[],grades:u.grades||[],teacher_id:u.teacherId||null})),['username','password','sections','grades','teacher_id']);

    else if(k==='sched'){
      const _uuidRe=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      const _dbRows=v.filter(r=>_uuidRe.test(r.id)).map(r=>({id:r.id,school_id:sid,category:r.category||'',program:r.program||'',facilitator:r.facilitator||'',delivery:r.delivery||'',type:r.type||'',duration:r.duration||'',month:r.month||'',start_date:r.startDate||null,end_date:r.endDate||null,venue:r.venue||'',target:r.target||'',status:r.status||'planned',cpd_id:r.cpdId||null}));

      return true;
    }
    else if(k==='impacts') return await sbUpsert('impact_entries',v.map(i=>({id:i.id,school_id:sid,level:i.level||'1',type:i.type||'',teacher_id:i.tid||null,value:i.value||'',evidence:i.evidence||'',date:i.date||null,term:i.term||''})));

    return true;
  }catch(e){console.warn('Supabase save failed for',k,e);return false;}

async function sbRemove(table,id){
  // Returns true = deleted (or nothing needed deleting), false = DB delete actually failed.
  // Callers use this to warn the user instead of silently showing "Deleted" when the
  // row is still sitting in Supabase and will reappear on next refresh.
  if(!SCHOOL_ID)return true;
  // Skip DB delete for seed IDs that are not valid UUIDs (e.g. 'sc1','sc2') — nothing in DB to remove
  const uuidRe=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
  if(!uuidRe.test(id))return true;
  return await sbDelete(table,id);
}

async function reconcileCpdScheduleLink(cpdId,fields){
  if(!SCHOOL_ID){
    // No DB — just keep local state sane
    const local=S.schedule.filter(r=>r.cpdId===cpdId);
    if(local.length===0){
      const newRow={id:uid(),category:'Internal - SDP-Based Training',program:fields.title,facilitator:fields.facilitator,
        delivery:fields.delivery,type:fields.type,month:fields.month,venue:fields.venue||'TBC',target:fields.audience,
        timeFrom:fields.timeFrom||'',timeTo:fields.timeTo||'',
        status:'active',cpdId,startDate:fields.date||'',endDate:''};
      S.schedule=[...S.schedule,newRow];
    } else {
      const keep=local[0];
      S.schedule=S.schedule.filter(r=>r.cpdId!==cpdId).concat({...keep,program:fields.title,facilitator:fields.facilitator,
        delivery:fields.delivery,type:fields.type,month:fields.month,target:fields.audience,
        venue:fields.venue||keep.venue||'TBC',timeFrom:fields.timeFrom||'',timeTo:fields.timeTo||'',
        startDate:fields.date||keep.startDate});
    }
    return;
  }
  try{
    const sid='school_id=eq.'+SCHOOL_ID;
    const rows=await sbGet('schedule_rows',sid+'&cpd_id=eq.'+encodeURIComponent(cpdId)+'&select=*');
    if(rows===null){console.warn('[reconcile] query failed, leaving as-is');return;}
    const _defCat=getSchedCats().includes('Internal - SDP-Based Training')?'Internal - SDP-Based Training':(getSchedCats()[0]||'Internal - SDP-Based Training');
    if(rows.length===0){
      // Nothing linked yet in the DB — create exactly one
      const newRow={id:uid(),category:_defCat,program:fields.title,facilitator:fields.facilitator,
        delivery:fields.delivery,type:fields.type,month:fields.month,venue:fields.venue||'TBC',target:fields.audience,
        timeFrom:fields.timeFrom||'',timeTo:fields.timeTo||'',
        status:'active',cpdId,startDate:fields.date||'',endDate:''};
      S.schedule=[...S.schedule.filter(r=>r.cpdId!==cpdId),newRow];
      await saveSchedRecord(newRow,S.schedule);
      return;
    }
    // One or more already exist in the DB: keep the best, delete the rest via raw DELETE
    const keeper=rows.find(r=>r.start_date)||rows[0];
    for(const r of rows){
      if(r.id!==keeper.id){
        await sbDelete('schedule_rows',r.id);
      }
    }
    const merged={id:keeper.id,category:keeper.category||_defCat,program:fields.title,facilitator:fields.facilitator,
      delivery:fields.delivery,type:fields.type,month:fields.month,venue:fields.venue||keeper.venue||'TBC',target:fields.audience,
      timeFrom:fields.timeFrom||keeper.time_from||'',timeTo:fields.timeTo||keeper.time_to||'',
      status:keeper.status||'active',cpdId,startDate:fields.date||keeper.start_date||'',endDate:keeper.end_date||''};
    S.schedule=[...S.schedule.filter(r=>r.cpdId!==cpdId),merged];
    await saveSchedRecord(merged,S.schedule);
  }catch(e){ console.warn('[reconcile] failed',e); }
}
async function autoCleanDuplicateSchedule(){
  if(!SCHOOL_ID){alert('No SCHOOL_ID resolved yet — cannot query Supabase.');return;}
  const sid='school_id=eq.'+SCHOOL_ID;
  const [rows,cpdRows]=await Promise.all([
    sbGet('schedule_rows',sid+'&select=*&order=program.asc'),
    sbGet('cpd_sessions',sid+'&select=id')
  ]);
  if(rows===null){alert('Could not fetch rows to clean — query failed.');return;}
  const realCpdIds=new Set((cpdRows||[]).map(c=>c.id));
  // Group rows that share the same cpd_id — these are always true duplicates
  // (one CPD session should only ever have one linked schedule row).
  const groups={};
  rows.forEach(r=>{ if(r.cpd_id){ (groups[r.cpd_id]=groups[r.cpd_id]||[]).push(r); } });
  const toDelete=[];
  const seen=new Set();
  Object.values(groups).forEach(group=>{
    if(group.length>1){
      // Keep whichever copy has a real start_date; otherwise keep the first one
      const keeper=group.find(r=>r.start_date)||group[0];
      group.forEach(r=>{ if(r.id!==keeper.id){toDelete.push(r);seen.add(r.id);} });
    }
  });
  // Orphaned rows: cpd_id set but that CPD session doesn't actually exist in the DB
  // (this happens when the CPD save itself failed but the schedule link was still created)
  let orphanCount=0;
  rows.forEach(r=>{
    if(r.cpd_id&&!realCpdIds.has(r.cpd_id)&&!seen.has(r.id)){
      toDelete.push(r);seen.add(r.id);orphanCount++;
    }
  });
  if(!toDelete.length){ alert('No duplicate or orphaned linked rows found — nothing to clean.'); openScheduleDbDebug(); return; }
  if(!confirm('Found '+(toDelete.length-orphanCount)+' duplicate row(s) and '+orphanCount+' orphaned row(s) (linked to a CPD session that doesn\'t exist). Delete them?'))return;
  let okCount=0,failCount=0;
  for(const r of toDelete){
    const ok=await sbDelete('schedule_rows',r.id);
    if(ok)okCount++; else failCount++;
  }
  alert('Cleanup finished. Deleted: '+okCount+(failCount?(' · Failed: '+failCount+' (check RLS/connection)'):''));
  openScheduleDbDebug();
}

async function backfillMissingCpdScheduleLinks(){
  if(!SCHOOL_ID){alert('No SCHOOL_ID resolved yet — cannot query Supabase.');return;}

  const linked=new Set(rows.filter(r=>r.cpd_id).map(r=>r.cpd_id));

    okCount++;
  }
  alert('Created '+okCount+' missing schedule row(s). Refreshing…');
  render();
  openScheduleDbDebug();
}

async function performCpdDelete(id,alsoDeleteSched){
  const linkedRow=S.schedule.find(r=>r.cpdId===id);
  let schedOk=true;
  if(alsoDeleteSched&&linkedRow){
    S.schedule=S.schedule.filter(r=>r.id!==linkedRow.id);
    sset('sched',S.schedule);
    schedOk=await sbRemove('schedule_rows',linkedRow.id);
  } else if(linkedRow){
    // Keeping the schedule entry: unlink it so it doesn't reference a deleted CPD session
    const unlinked={...linkedRow,cpdId:null};
    S.schedule=S.schedule.map(r=>r.id===linkedRow.id?unlinked:r);
    await saveSchedRecord(unlinked,S.schedule);
  }
  S.cpd=S.cpd.filter(c=>c.id!==id);
  sset('cpd',S.cpd);
  const cpdOk=await sbRemove('cpd_sessions',id);
  S.modal=null;
  if(cpdOk===false||schedOk===false){
    showToast('Removed locally, but the database delete failed (check connection) — it may reappear on refresh. Try again.','error');
  } else {
    showToast('Deleted');
  }
  render();
}

  if(!uuidRe4.test(id)){

function getAllUsers(){
  const local=S.users||[];
  const deleted=S.deletedSeedUsers||DEFAULT_DELETED_SEED_USERS;
  const merged=SEED_USERS.filter(su=>!deleted.includes(su.id)).map(su=>{
    const override=local.find(lu=>lu.id===su.id);
    return override?{...su,...override}:su;
  });
  local.forEach(lu=>{if(!deleted.includes(lu.id)&&!merged.find(m=>m.id===lu.id))merged.push(lu);});
  return merged;
}
function generateUsername(name){
  const parts=(name||'').trim().toLowerCase().replace(/[^a-z\s]/g,'').split(/\s+/).filter(Boolean);
  const base=(parts[0]||'teacher')+(parts[1]?'.'+parts[1]:'');
  const all=getAllUsers();
  let uname=base,n=1;
  while(all.find(u=>(u.username||'').toLowerCase()===uname)){uname=base+n;n++;}
  return uname;
}
function generateTeacherPassword(){

// ── Bulk Add Teachers: CSV/Excel file parsing ───────────────────────────────
// Minimal CSV parser (handles quoted fields containing commas/newlines) — used for .csv/.txt
// uploads so Bulk Add Teachers doesn't depend on any external library for the common case.
function parseCSV(text){
  const rows=[];let row=[],field='',inQuotes=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQuotes){
      if(c==='"'){if(text[i+1]==='"'){field+='"';i++;}else inQuotes=false;}
      else field+=c;
    }else{
      if(c==='"')inQuotes=true;
      else if(c===','){row.push(field);field='';}
      else if(c==='\n'||c==='\r'){
        if(field!==''||row.length){row.push(field);rows.push(row);row=[];field='';}
        if(c==='\r'&&text[i+1]==='\n')i++;
      }else field+=c;
    }
  }
  if(field!==''||row.length){row.push(field);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}

function renderToast(){
  const cls=S.toast.type==='error'?'badge-red':'badge-green';
  return `<div class="badge ${cls}" style="position:fixed;top:16px;right:16px;z-index:9999;padding:10px 16px;font-size:13px;box-shadow:0 4px 12px rgba(0,0,0,.15)">${S.toast.msg}</div>`;
}

function renderView(){
  switch(S.view){
    case 'dashboard': return renderDashboard();
    case 'schedule': return renderSchedule();
    case 'teachers': return renderTeachers();
    case 'fieldwork': return renderFieldwork();
    case 'triplets': return renderCPD();

function renderSchedule(){
  const cats=getSchedCats();
  const mf=S.schedMonthFilter||'';
  const df=S.schedDateFrom||'';
  const dt=S.schedDateTo||'';
  const curMonthName=new Date().toLocaleString('en',{month:'long'});
  let filteredSched=S.schedule.slice();
  if(mf) filteredSched=filteredSched.filter(r=>r.month===mf);
  if(df) filteredSched=filteredSched.filter(r=>(r.startDate||r.endDate||'')>=df);
  if(dt) filteredSched=filteredSched.filter(r=>(r.startDate||r.endDate||'')<=(dt+'Z'));
  // Conflict detection — a real conflict only counts once date, time AND place
  // have all been checked (see schedRowsConflict above): different times or
  // different rooms on the same date are not flagged as conflicts.
  const conflicts=new Set();
  filteredSched.forEach((r,i)=>{filteredSched.forEach((r2,j)=>{
    if(i>=j)return;
    if(schedRowsConflict(r,r2)){conflicts.add(r.id);conflicts.add(r2.id);}
  });});
  const statusBadge=s=>s==='done'?'badge-green':s==='active'?'badge-amber':'badge-gray';
  const hasFilter=mf||df||dt;
  return `
<div class="card mb-3" style="padding:10px 14px">
  <div class="flex items-center gap-2 mb-2" style="flex-wrap:wrap">

function renderTeachers(){
  const q=(S.teacherSearch||'').toLowerCase();
  let teachers=scopedTeachers();

  if((S.tchDepts||[]).length>0) teachers=teachers.filter(t=>S.tchDepts.includes(t.dept));
  // Apply section filter
  if((S.tchSects||[]).length>0) teachers=teachers.filter(t=>S.tchSects.includes(t.section));
  // Apply stage filter (Primary / Lower Secondary / Upper Secondary / KG)
  if((S.tchStages||[]).length>0) teachers=teachers.filter(t=>S.tchStages.includes(t.stage));
  // Apply search
  if(q) teachers=teachers.filter(t=>t.name.toLowerCase().includes(q)||t.dept.toLowerCase().includes(q));
  const groups=S.groups;
  const hasFilters=(S.tchDepts||[]).length>0||(S.tchSects||[]).length>0||(S.tchStages||[]).length>0||q;
  return `
<div class="card mb-3" style="padding:10px 14px">
  <div class="flex items-center gap-2 mb-2" style="flex-wrap:wrap">
    <span style="font-size:11px;font-weight:700;color:var(--muted);min-width:72px">Department:</span>
    <div class="pill-opt ${(S.tchDepts||[]).length===0?'sel':''}" data-tch-dept="">All</div>
    ${DEPTS.map(d=>`<div class="pill-opt ${(S.tchDepts||[]).includes(d)?'sel':''}" data-tch-dept="${d}">${d}</div>`).join('')}
  </div>
  <div class="flex items-center gap-2 mb-2" style="flex-wrap:wrap">
    <span style="font-size:11px;font-weight:700;color:var(--muted);min-width:72px">Section:</span>
    <div class="pill-opt ${(S.tchSects||[]).length===0?'sel':''}" data-tch-sect="">All</div>
    ${SECTIONS.map(s=>`<div class="pill-opt ${(S.tchSects||[]).includes(s)?'sel':''}" data-tch-sect="${s}">${s}</div>`).join('')}
  </div>
  <div class="flex items-center gap-2" style="flex-wrap:wrap">
    <span style="font-size:11px;font-weight:700;color:var(--muted);min-width:72px">Stage:</span>
    <div class="pill-opt ${(S.tchStages||[]).length===0?'sel':''}" data-tch-stage="">All Stages</div>
    ${STAGES.map(s=>`<div class="pill-opt ${(S.tchStages||[]).includes(s)?'sel':''}" data-tch-stage="${s}">${s}</div>`).join('')}
  </div>
</div>
<div class="flex justify-between items-center mb-3">
  ${canEdit()?`<div class="flex gap-2">
    <button class="btn btn-primary" data-modal="teacher">+ Add Teacher</button>
    <button class="btn btn-ghost" data-modal="bulkTeachers">+ Bulk Add</button>
    <button class="btn btn-ghost" data-modal="group">+ Add Group</button>
  </div>`:'<div></div>'}
  <div class="flex items-center gap-2">
    <input class="form-control" id="teacher-search-box" placeholder="🔍 Search name or department…" value="${esc(S.teacherSearch||'')}" style="width:220px;padding:5px 9px;font-size:12px">
    ${q?`<button class="btn btn-ghost btn-sm" onclick="S.teacherSearch='';render()">✕</button>`:''}
    ${hasFilters?`<button class="btn btn-ghost btn-sm" onclick="S.tchDepts=[];S.tchSects=[];S.tchStages=[];S.teacherSearch='';render()">✕ Clear all</button>`:''}
    <span class="text-xs text-muted">${teachers.length} teacher${teachers.length!==1?'s':''}</span>
  </div>
</div>
${q&&!teachers.length?`<div class="card" style="text-align:center;color:var(--muted);padding:20px;font-style:italic">No teachers match current filters.</div>`:''}
${groups.map(g=>{
  const ts=teachers.filter(t=>t.groupId===g.id);
  if(hasFilters&&!ts.length)return'';
  return `<div class="card">
    <div class="flex justify-between items-center mb-3">
      <div class="card-title" style="margin:0"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${g.color};margin-right:6px"></span>${g.name}</div>
      <div class="flex gap-2 items-center">
        <span class="badge badge-blue">${ts.length} teachers</span>
        <button class="btn btn-sm btn-ghost" onclick="printTeacherGroup('${g.id}')" title="Print this group">🖨</button>
        ${canEdit()?`<button class="btn btn-sm btn-ghost" data-edit-group="${g.id}" style="font-size:11px">✏ Edit</button>
        <button class="btn btn-sm btn-danger" data-del-group="${g.id}">✕ Delete</button>`:''}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px">
      ${ts.map(t=>{
        const st=tStats(t);
        const allObs=S.observations.filter(o=>o.tid===t.id).sort((a,b)=>(a.date||'').localeCompare(b.date||''));
        const allAvgs=allObs.map(o=>domAvg(o.scores));
        const overallAvg=allAvgs.length?allAvgs.reduce((a,b)=>a+b,0)/allAvgs.length:0;
        const shownObs=[];
        if(allObs.length>=1)shownObs.push({o:allObs[0],lbl:'Initial'});
        if(allObs.length>=3)shownObs.push({o:allObs[allObs.length-2],lbl:'Prev'});
        if(allObs.length>=2)shownObs.push({o:allObs[allObs.length-1],lbl:'Latest'});
        else if(allObs.length===1)shownObs[0]={o:allObs[0],lbl:'Only'};
        const trend=allObs.length>=2?allAvgs[allAvgs.length-1]-allAvgs[allAvgs.length-2]:null;
        const trendIcon=trend===null?'':trend>0.15?'📈':trend<-0.15?'📉':'➡️';
        const trendColor=trend===null?'':trend>0.15?'var(--teal)':trend<-0.15?'var(--red)':'var(--muted)';
        return `<div style="background:var(--light);border-radius:8px;padding:10px 12px;border:1px solid var(--border)">
          <div style="font-weight:600;font-size:13px;direction:auto">${esc(t.name)}</div>
          <div class="text-xs text-muted mt-1">${esc(t.dept)} · ${esc(t.section)} · ${esc(t.stage)}</div>
          ${(t.grades||[]).length?`<div class="mt-1" style="display:flex;gap:3px;flex-wrap:wrap">${t.grades.map(g=>`<span class="badge badge-gray" style="font-size:9px;padding:1px 5px">${esc(g)}</span>`).join('')}</div>`:''}
          <div class="flex gap-2 mt-2 items-center flex-wrap">
            <span class="badge badge-${st.count>0?'green':'gray'}">${st.count} obs</span>
            ${overallAvg>0?`<span class="badge badge-blue">Avg ${overallAvg.toFixed(1)}/5</span>`:''}
            ${trend!==null?`<span style="font-size:13px;font-weight:700;color:${trendColor}" title="Progress since last obs">${trendIcon} ${trend>0?'+':''}${trend.toFixed(1)}</span>`:''}
          </div>
          ${shownObs.length>0?`<div style="margin-top:8px;padding-top:6px;border-top:1px solid var(--border)">
            ${shownObs.map(({o,lbl})=>{
              const da=domAvg(o.scores);
              const bc=da>=4?'var(--teal)':da>=3?'var(--amber)':da>0?'var(--red)':'#9ca3af';
              return `<div style="margin-bottom:4px">
                <div class="flex justify-between items-center">
                  <span style="font-size:10px;color:var(--muted)">${lbl} · ${o.date||'—'}</span>
                  <span style="font-size:11px;font-weight:700;color:${bc}">${da>0?da.toFixed(1)+'/5':'—'}</span>
                </div>
                <div class="pbar" style="height:3px;margin-top:2px"><div class="pbar-fill" style="width:${Math.min(100,da/5*100)}%;background:${bc}"></div></div>
              </div>`;
            }).join('')}
          </div>`:''}
          ${canEdit()?`<div class="flex gap-1 mt-2">
            <button class="btn btn-sm btn-primary" data-new-obs="${t.id}">+ Obs</button>
            <button class="btn btn-sm btn-ghost" data-edit-teacher="${t.id}">✏</button>
            <button class="btn btn-sm btn-danger" data-del-teacher="${t.id}">✕</button>
          </div>`:''}
        </div>`;
      }).join('')}
      ${!ts.length?'<p style="color:var(--muted);font-size:12px;font-style:italic">No teachers in this group</p>':''}
    </div>
  </div>`;
}).join('')}`
}

function renderMyPortal(){
  // Find the teacher record linked to this session by name match
  const myName=(S.session?.name||'').toLowerCase();
  const me=S.teachers.find(t=>t.name.toLowerCase()===myName||t.name.toLowerCase().includes(myName.split(' ')[0]));
  const myObs=me?S.observations.filter(o=>o.tid===me.id).sort((a,b)=>(b.date||'').localeCompare(a.date||'')):[];
  const myTrips=me?S.triplets.filter(t=>t.oid===me.id||t.cid===me.id||t.fid===me.id):[];
  const dept=me?.dept||'';
  const myTLC=dept?S.deptTLC.filter(g=>(g.depts||[]).includes(dept)):[];
  // Schedule: show entries where target includes dept, whole school, or boys/girls
  const mySchedule=S.schedule.filter(r=>{
    if(!r.target)return false;
    const tgt=(r.target||'').toLowerCase();
    return tgt.includes('all')||tgt.includes(dept.toLowerCase())||tgt.includes('whole')||
           (me?.section&&tgt.includes(me.section.toLowerCase()));
  }).sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''));
  const tab=S.myPortalTab||'overview';

  return `
<div class="card mb-3" style="background:linear-gradient(135deg,#1F4E79,#0F6E56);color:#fff;border:none;padding:20px 22px">
  <div class="flex justify-between items-center">
    <div>
      <div style="font-size:20px;font-weight:800;margin-bottom:4px">👤 ${esc(S.session?.name||'')}</div>
      <div style="font-size:13px;opacity:.85">${me?esc(me.dept)+' · '+esc(me.section)+' · '+esc(me.stage):'Connect your teacher record in Settings'}</div>
      ${me?`<div style="font-size:11px;opacity:.7;margin-top:4px">${esc(me.groupId?S.groups.find(g=>g.id===me.groupId)?.name||'':'')} · ${myObs.length} observations · ${myTrips.length} coaching sessions</div>`:''}
    </div>
    <div style="text-align:right">
      ${myObs.length>0?`<div style="font-size:28px;font-weight:800">${avg(myObs.map(o=>domAvg(o.scores)).filter(x=>x>0))>0?avg(myObs.map(o=>domAvg(o.scores)).filter(x=>x>0)).toFixed(1)+'/5':'—'}</div><div style="font-size:11px;opacity:.7">Overall average</div>`:''}
    </div>
  </div>
</div>
<div class="tabs">
  <button class="tab ${tab==='overview'?'active':''}" data-myportal-tab="overview">📊 Overview</button>
  <button class="tab ${tab==='obs'?'active':''}" data-myportal-tab="obs">📋 My Observations (${myObs.length})</button>
  <button class="tab ${tab==='coaching'?'active':''}" data-myportal-tab="coaching">🎯 My Coaching (${myTrips.length})</button>
  <button class="tab ${tab==='tlc'?'active':''}" data-myportal-tab="tlc">🤝 TLC (${myTLC.length})</button>

</div>

${tab==='overview'?`
  ${!me?'<div class="alert alert-warn mb-3">Your name was not matched to a teacher record. Ask your administrator to ensure your user name matches your teacher profile.</div>':''}
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
    <div class="kpi" style="border-top:3px solid #1F4E79">
      <div class="kpi-val">${myObs.length}</div><div class="kpi-label">Observations</div>
    </div>

function renderImpact(){
  const tab=S.impTab||'L1';
  // Multi-filter state
  const iDepts=S.impDepts||[];
  const iSects=S.impSects||[];
  const iStages=S.impStages||[];

  // Filter helper
  const filterT=(t)=>{
    if(!t)return true;
    if(iDepts.length&&!iDepts.includes(t.dept))return false;
    if(iSects.length&&!iSects.includes(t.section))return false;
    if(iStages.length&&!iStages.includes(t.stage))return false;
    return true;
  };
  // Filtered data
  const obs=scopedObs().filter(o=>{
    const t=o.tid?S.teachers.find(t=>t.id===o.tid):null;
    if(!filterT(t))return false;
    if(S.impDateFrom&&(o.date||'')<S.impDateFrom)return false;
    if(S.impDateTo&&(o.date||'')>S.impDateTo)return false;
    return true;
  });
  const trips=S.triplets.filter(t=>{
    const tc=S.teachers.find(tc=>tc.id===t.oid);
    if(!filterT(tc))return false;
    if(S.impDateFrom&&(t.od||'')<S.impDateFrom)return false;
    if(S.impDateTo&&(t.od||'')>S.impDateTo)return false;
    return true;
  });
  const lws=S.lwalks.filter(lw=>{
    if(iDepts.length&&lw.dept&&!iDepts.includes(lw.dept))return false;
    if(iSects.length&&lw.section&&!iSects.includes(lw.section))return false;
    if(S.impDateFrom&&(lw.date||'')<S.impDateFrom)return false;
    if(S.impDateTo&&(lw.date||'')>S.impDateTo)return false;
    return true;
  });
  const impacts=S.impacts.filter(i=>{
    if(i.level!==tab.replace('L',''))return false;
    if(i.tid){const t=S.teachers.find(t=>t.id===i.tid);if(!filterT(t))return false;}
    return true;
  });
  const progress=S.progress.filter(p=>{
    if(iDepts.length&&p.dept&&!iDepts.includes(p.dept))return false;
    if(iSects.length&&p.section&&!iSects.includes(p.section))return false;
    return true;
  });

  // Build filter UI
  let html='';
  html+=`<div class="card mb-3" style="padding:10px 14px">

    <span style="font-size:11px;font-weight:700;color:var(--muted);min-width:80px">Stage:</span>
    <div class="pill-opt ${iStages.length===0?'sel':''}" data-imp-stage="">All Stages</div>

  <div class="flex items-center gap-2" style="flex-wrap:wrap">

    ${(S.impDateFrom||S.impDateTo)?'<button class="btn btn-ghost btn-sm" onclick="clearImpDates()">✕ Clear</button>':''}
  </div>
</div>`;

  // Tabs
  html+=`<div class="tabs">

  // ── L3: Impact on Students ──────────────────────────────────────────────────
  if(tab==='L3'){

    const manualRatings={};

      {key:'questioning',name:'Depth of Questioning',lps:['LP4'],tech:'Cold call',score:qObs.length?avg(qObs.flatMap(o=>[...(o.scores?.d3||[]),(o.scores?.d4||[])]).filter(x=>x>0)):0,count:qObs.length},
      {key:'thinking',name:'Critical Thinking',lps:['LP4'],tech:'Ratio of pupil thought',score:ctObs.length?avg(ctObs.map(o=>avg(o.scores.d4||[]))):0,count:ctObs.length},
      {key:'collaboration',name:'Collaboration',lps:['LP2','LP5'],tech:'Think, Pair, Share',score:colObs.length?avg(colObs.map(o=>avg(o.scores.d4||[]))):colTrips.length>=1?3:0,count:colObs.length+colTrips.length},
      {key:'ownership',name:'Student Ownership',lps:['LP5','LP6'],tech:'Metacognition: Obvious organisers',score:soObs.length?avg(soObs.flatMap(o=>[...(o.scores?.d4||[]),(o.scores?.d5||[])]).filter(x=>x>0)):0,count:soObs.length},
      {key:'independence',name:'Independence',lps:['LP5'],tech:'Overnarration & silence',score:indObs.length?avg(indObs.map(o=>avg(o.scores.d5||[]))):0,count:indObs.length},
    ];
    html+=`<div style="border:2px solid var(--teal);border-radius:10px;padding:16px;margin-bottom:14px">

  <div style="font-size:11px;color:var(--muted);margin-bottom:14px">Auto-read from observations, coaching triplets, CPD sessions and learning walks.</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px">
  ${L3_ROWS.map(row=>{
    const ds=manualRatings[row.key]||row.score;
    const pct=Math.min(100,ds/5*100);
    const bc=ds>=4?'var(--teal)':ds>=3?'var(--amber)':ds>0?'var(--red)':'#e5e7eb';
    const me=S.impacts.find(i=>i.level==='3'&&i.type===row.key);
    return `<div style="background:#fff;border:1px solid var(--border);border-radius:8px;padding:12px 14px">
      <div style="font-size:13px;font-weight:600;margin-bottom:6px">${row.name}</div>
      <div class="flex gap-1 mb-2 flex-wrap">
        ${row.lps.map(lp=>'<span class="badge badge-blue" style="font-size:10px">'+lp+'</span>').join('')}
        <span style="background:#f3f4f6;color:#374151;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600">${esc(row.tech)}</span>
        <span style="font-size:10px;color:var(--muted);padding:2px 4px">${row.count} entries</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
        <div style="flex:1;height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden"><div style="height:100%;border-radius:3px;background:${bc};width:${pct}%;transition:width .4s"></div></div>
        <span style="font-size:13px;font-weight:700;color:${bc};min-width:36px">${ds>0?ds.toFixed(1)+'/5':'—'}</span>
      </div>
      <div class="flex gap-1 items-center flex-wrap">
        ${[1,2,3,4,5].map(n=>{const active=(manualRatings[row.key]||0)>=n;return `<button data-l3-rate="${row.key}-${n}" style="width:26px;height:26px;border-radius:4px;border:1px solid ${active?'var(--teal)':'var(--border)'};background:${active?'var(--teal)':'transparent'};color:${active?'#fff':'var(--muted)'};font-size:11px;font-weight:600;cursor:pointer">${n}</button>`;}).join('')}
        ${ds>0&&!manualRatings[row.key]?'<span style="font-size:10px;color:var(--teal);margin-left:4px">auto</span>':''}
        ${me&&canEdit()?`<button class="btn btn-sm btn-danger" style="margin-left:auto;padding:1px 6px" data-del-impact="${me.id}">✕</button>`:''}
      </div>
    </div>`;
  }).join('')}
  </div>
  <div style="background:var(--light);border-radius:8px;padding:10px 14px;margin-bottom:12px">
    <div style="font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px">EVIDENCE SUMMARY</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap;font-size:12px">
      <span>🔍 <strong>${obs.length}</strong> observations</span>
      <span>🎯 <strong>${colTrips.length}</strong> coaching cycles complete</span>
      <span>📚 <strong>${S.cpd.filter(c=>c.after&&c.after.trim()).length}</strong> CPD sessions with after-content</span>
      <span>🚶 <strong>${lws.filter(lw=>lw.strengths).length}</strong> learning walks with strengths</span>
    </div>
  </div>

</div>`;
  }

  // ── Student Progress ────────────────────────────────────────────────────────
  if(tab==='progress'){
    html+=`<div class="mb-3 flex gap-2">
  ${canEdit()?'<button class="btn btn-primary" data-modal="prog">+ Add Progress Entry</button>':''}
</div>
<div class="tabs" style="margin-bottom:8px">
  ${['internal','external','portfolio'].map(m=>`<button class="tab ${(S.progMode||'internal')===m?'active':''}" data-prog-mode="${m}">${m}</button>`).join('')}
</div>`;
    const modeRows=progress.filter(p=>p.mode===(S.progMode||'internal'));
    if(modeRows.length){
      html+=modeRows.slice().reverse().map(p=>`<div class="card" style="border-left:3px solid var(--teal)">
  <div class="flex justify-between items-center mb-1">
    <div><span style="font-weight:600;direction:auto">${esc(p.subject)}</span> <span class="badge badge-blue">${esc(p.dept)}</span> <span class="badge badge-gray">${esc(p.grade)}</span> <span class="badge badge-gray">${esc(p.section)}</span></div>

    ${Object.entries(p.scores||{}).map(([k,v])=>`<span class="badge badge-${v>=70?'green':v>=50?'amber':'red'}">${k}: ${v}</span>`).join('')}
  </div>
</div>`).join('');
    } else {
      html+=`<div class="card" style="text-align:center;color:var(--muted);padding:30px;font-style:italic">No progress entries yet for ${S.progMode||'internal'} mode.</div>`;
    }
  }

  return html;
}


function renderProcess(){
  const dept=S.procDept||'';
  const pSects=S.procSects||[];
  const pStages=S.procStages||[];
  const matchT=(t)=>{
    if(!t)return true;
    if(dept&&t.dept!==dept)return false;
    if(pSects.length&&!pSects.includes(t.section))return false;
    if(pStages.length&&!pStages.includes(t.stage))return false;
    return true;
  };
  const snaps=dept?S.snapshots.filter(s=>(s.dept||'Whole School')===dept):S.snapshots;
  const ratings=S.currentRatings||{};
  const obs=scopedObs().filter(o=>{const t=o.tid?S.teachers.find(t=>t.id===o.tid):null;if(!matchT(t))return false;if(S.procDateFrom&&(o.date||'')<S.procDateFrom)return false;if(S.procDateTo&&(o.date||'')>S.procDateTo)return false;return true;});
  const trips=S.triplets.filter(t=>{const tc=S.teachers.find(tc=>tc.id===t.oid);if(!matchT(tc))return false;if(S.procDateFrom&&(t.od||'')<S.procDateFrom)return false;if(S.procDateTo&&(t.od||'')>S.procDateTo)return false;return true;});
  const cpd=S.cpd, impacts=S.impacts;
  const totalM=totalMechs();
  const SECS=[
    {title:'Design Quality',color:'var(--navy)',items:[
      {id:'dq1',lbl:'Sessions content-focused & NEASC LP linked',weak:'Ad hoc topics, no LP alignment',strong:'Every session: QFT + NEASC + EEF evidence',live:obs.length>0?obs.length+' obs logged':null},
      {id:'dq2',lbl:'Biol-Og booklet assigned before every session ★',weak:'No booklet assigned',strong:'1 week ahead via Canvas; activation + model',live:obs.filter(o=>o.bio).length>0?obs.filter(o=>o.bio).length+' obs with technique':null},
      {id:'dq3',lbl:'All 6 D-H pillars active',weak:'1–2 pillars only',strong:'All 6 consistently evidenced',live:totalDH()+'/6 active'},
      {id:'dq4',lbl:'Prior knowledge activated every session',weak:'No activation',strong:'Allen model / Biol-Og opener',live:obs.filter(o=>o.bio).length>0?obs.filter(o=>o.bio).length+' obs with activation':null},
      {id:'dq5',lbl:'In-session rehearsal (15 min) included',weak:'No rehearsal',strong:'15-min technique rehearsal in every session',live:null},
      {id:'dq6',lbl:'Groups right-sized (≤8, subject + grade)',weak:'Large impersistent groups',strong:'Subject/grade ≤8; same group persists',live:null},
    ]},
    {title:'Collaboration & Coaching',color:'var(--teal)',items:[
      {id:'cc1',lbl:'Coaching triplets operating (all 3 cycles)',weak:'None active',strong:'All staff in rotating triplets; 3 full cycles',live:trips.length+' sessions · '+trips.filter(t=>t.status==='complete').length+' complete'},
      {id:'cc2',lbl:'Biol-Og technique = triplet focus ★',weak:'No specific focus',strong:'Booklet technique is the observable',live:trips.filter(t=>t.bio).length>0?trips.filter(t=>t.bio).length+' trips with focus':null},
      {id:'cc3',lbl:'Peer visits with WWW/EBI + domain focus',weak:'No structured visits',strong:'Structured protocol; domain-linked feedback',live:obs.filter(o=>o.www&&o.ebi).length>0?obs.filter(o=>o.www&&o.ebi).length+' with full feedback':null},
      {id:'cc4',lbl:'MLs empowered as CPD designers',weak:'SLT designs all CPD',strong:'MLs complete balanced design sheet',live:cpd.length>0?cpd.length+' CPD sessions':null},
      {id:'cc5',lbl:'Learning Walks active and feeding planning',weak:'No walks',strong:'Regular walks; AFD feeds CPD design',live:S.lwalks.length>0?S.lwalks.length+' walks':null},
    ]},
    {title:'Time & Sustainability',color:'var(--amber)',items:[
      {id:'ts1',lbl:'Protected time for coaching triplets (Tue)',weak:'No dedicated time',strong:'Weekly Tue slot protected',live:null},
      {id:'ts2',lbl:'CPD not end-of-week or end-of-day',weak:'All Thu pm; fatigue',strong:'Tue/Wed, high-energy; max 60 min',live:null},
      {id:'ts3',lbl:'Meetings replaced with collaboration time',weak:'All time in meetings',strong:'50%+ → TLC/coaching',live:null},

function exportUsersForGitHub(){
  const allUsers=getAllUsers();
  const lines=allUsers.map(u=>`  {id:'${u.id}',name:'${(u.name||'').replace(/'/g,"\'")}',fullName:'${(u.fullName||u.name||'').replace(/'/g,"\'")}',username:'${u.username}',password:'${u.password}',role:'${u.role}',depts:${JSON.stringify(u.depts||[])}${u.teacherId?`,teacherId:'${u.teacherId}'`:''}}`).join(',\n');
  window.__exportCode=`const SEED_USERS = [\n${lines}\n];`;
  S.modal=`<div class="modal-overlay" id="modal-overlay"><div class="modal"><div class="modal-header"><h3>⬇ Export Users for GitHub</h3><button class="btn btn-ghost btn-sm" data-close-modal>✕</button></div><div class="modal-body"><div style="background:#f8fafc;border:1px solid var(--border);border-radius:6px;padding:12px;font-family:monospace;font-size:11px;white-space:pre-wrap;word-break:break-all;max-height:260px;overflow-y:auto">${esc(window.__exportCode)}</div><div style="margin-top:12px;font-size:12px;color:var(--muted)"><strong>Steps:</strong><br>1. Tap Copy<br>2. GitHub → index.html → pencil<br>3. Find const SEED_USERS = [ and replace<br>4. Commit → Vercel auto-deploys</div><button class="btn btn-success" style="margin-top:10px;width:100%" id="copy-export-btn">📋 Copy to Clipboard</button></div><div class="modal-footer"><button class="btn btn-primary" data-close-modal>Close</button></div></div></div>`;
  render();
}
function openModal(type, data={}){
  S.modal = renderModal(type, data);
  render();
}

function renderModal(type, data={}){
  const M=(title,body,footer)=>`
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>${title}</h3>
        <button class="btn btn-ghost btn-sm" data-close-modal>✕</button>
      </div>
      <div class="modal-body">${body}</div>
      <div class="modal-footer">${footer}</div>
    </div>
  </div>`;

  const FI=(id,label,val='',type='text',placeholder='')=>
    `<div class="form-group"><label class="form-label">${label}</label>
    <input class="form-control rtl" id="${id}" type="${type}" value="${val||''}" placeholder="${placeholder}"></div>`;
  const FS=(id,label,opts,val='')=>
    `<div class="form-group"><label class="form-label">${label}</label>
    <select class="form-control" id="${id}">${opts.map(o=>typeof o==='string'?'<option '+(val===o?'selected':'')+'>'+o+'</option>':'<option value="'+o.v+'" '+(val===o.v?'selected':'')+'>'+o.l+'</option>').join('')}</select></div>`;
  const FT=(id,label,teacherId,placeholder='Type to search a name…')=>{
    const t=teacherId?scopedTeachers().find(x=>x.id===teacherId):null;
    return `<div class="form-group" style="position:relative">
    <label class="form-label">${label}</label>
    <input class="form-control rtl teacher-ac-input" id="${id}-txt" data-hidden-id="${id}" autocomplete="off" placeholder="${placeholder}" value="${esc(t?t.name:'')}">
    <input type="hidden" id="${id}" value="${teacherId||''}">
    <div class="teacher-ac-list" id="${id}-txt-list" style="display:none;position:absolute;z-index:50;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.15);max-height:190px;overflow-y:auto;width:100%;margin-top:2px"></div>
    </div>`;
  };
  const FTA=(id,label,val='',rows=3)=>
    `<div class="form-group"><label class="form-label">${label}</label>
    <textarea class="form-control rtl" id="${id}" rows="${rows}">${val||''}</textarea></div>`;
  const G2=(a,b)=>`<div class="grid-2">${a}${b}</div>`;
  const userName=S.session?.name||'';

  if(type==='obs'){
    const isEdit=!!(data.id);
    const preT=data.tid||'';
    const techVal=data.customTech?'Other':(data.bio||'');
    return M((isEdit?'✏ Edit':'📋 New')+' Observation',
      FT('obs-tid','Teacher',preT)+
      G2(FI('obs-date','Date',data.date||new Date().toISOString().split('T')[0],'date'),FI('obs-obs','Observed by',data.observer||userName))+
      techSelector('obs-tech','obs-custom-tech',techVal,data.customTech||'')+
      '<p class="text-xs text-muted mb-2">Hover (or tap ℹ rubric) on any criterion to see what each score 1–5 means, and add a note under each one to justify your rating.</p>'+
      '<div id="obs-domains">' +
      getDomains().map(d=>`<div class="card" style="border-left:4px solid var(--navy);margin-bottom:10px;padding:10px 12px">
        <div class="card-title" style="margin-bottom:8px">${esc(d.n)}</div>
        ${d.criteria.map((c,i)=>{
          const existingScore=(data.scores&&data.scores[d.id]&&data.scores[d.id][i])||0;
          const existingComment=(data.comments&&data.comments[d.id]&&data.comments[d.id][i])||'';
          const descs=criteriaDescriptors(d.id,i);
          return `<div style="background:var(--light);border-radius:6px;padding:8px 10px;margin-bottom:8px">
            <div class="flex justify-between items-center mb-1" style="gap:8px">
              <div style="font-size:12px;font-weight:600">${i+1}. ${esc(c)}</div>
              ${descs?`<span style="font-size:10px;color:var(--teal);cursor:pointer;white-space:nowrap" onclick="const el=document.getElementById('crit-desc-${d.id}-${i}');if(el)el.style.display=el.style.display==='none'?'block':'none';">ℹ rubric</span>`:''}
            </div>
            <div class="flex gap-1 mb-1">${[1,2,3,4,5].map(n=>{
              const lvlText=descs?descs[n-1]:'';
              const tip=n+' — '+LEVEL_LABELS[n-1]+(lvlText?': '+lvlText:'');
              return `<button type="button" data-score="${d.id}-${i}-${n}" title="${esc(tip)}" style="width:28px;height:28px;border-radius:4px;border:1px solid ${n===existingScore?'var(--navy)':'var(--border)'};background:${n===existingScore?'var(--navy)':'var(--white)'};color:${n===existingScore?'#fff':'inherit'};font-size:11px;font-weight:600;cursor:pointer">${n}</button>`;
            }).join('')}</div>
            ${descs?`<div id="crit-desc-${d.id}-${i}" style="display:none;margin:6px 0;font-size:11px;line-height:1.5;border-top:1px dashed var(--border);padding-top:6px">
              ${descs.map((txt,li)=>`<div style="margin-bottom:4px"><strong style="color:${LEVEL_COLORS[li]}">${li+1} — ${LEVEL_LABELS[li]}:</strong> ${esc(txt)}</div>`).join('')}
            </div>`:''}
            <textarea class="form-control obs-crit-comment" data-di="${d.id}" data-ci="${i}" rows="1" placeholder="Notes for this criterion (optional)" style="font-size:11px;padding:4px 6px;min-height:28px">${esc(existingComment)}</textarea>
          </div>`;
        }).join('')}
      </div>`).join('') +
      '</div>'+
      G2(FI('obs-conf','Confidence (1-5)',data.conf||'','number'),FS('obs-scope','Scope',['teacher','dept','boys','girls','school'],data.scope||'teacher'))+
      G2(FTA('obs-www','Key Strengths (WWW)',data.www||''),FTA('obs-ebi','Areas for Development (EBI)',data.ebi||''))+
      FTA('obs-action','Action Step',data.action||''),
      `<button class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-success" data-save-obs>${isEdit?'Update Observation':'Save Observation'}</button>`
    );
  }

  if(type==='lw'){
    const isEdit=!!(data.id);
    const _lwImgs=window.__lwMediaImages||[];
    const _lwVids=window.__lwMediaVideos||[];
    const lwImgChip=(src,idx)=>`<span class="lw-media-img-item" style="position:relative;display:inline-block"><img src="${src}" style="max-height:90px;border-radius:6px;border:1px solid var(--border)"><button type="button" class="btn btn-ghost btn-sm" style="position:absolute;top:-8px;right:-8px;background:#fff;border-radius:50%;padding:0 5px;line-height:18px" onclick="removeLwMediaImage(${idx})">✕</button></span>`;
    const lwVidChip=(src,idx)=>`<span class="lw-media-vid-item" style="position:relative;display:inline-block"><video src="${src}" controls style="max-height:100px;max-width:160px;border-radius:6px;border:1px solid var(--border)"></video><button type="button" class="btn btn-ghost btn-sm" style="position:absolute;top:-8px;right:-8px;background:#fff;border-radius:50%;padding:0 5px;line-height:18px" onclick="removeLwMediaVideo(${idx})">✕</button></span>`;
    return M((isEdit?'✏ Edit':'🚶 New')+' Learning Walk',
      G2(FI('lw-date','Date',data.date||new Date().toISOString().split('T')[0],'date'),FI('lw-obs','Observer',data.observer||userName))+
      G2(FS('lw-sect','Section',['','Boys','Girls'],data.section||''),FS('lw-dept','Department',['', ...DEPTS],data.dept||''))+
      FS('lw-grade','Grade',['', ...GRADES],data.grade||'')+
      techSelector('lw-tech','lw-custom-tech',data.customTech?'Other':(data.bio||''),data.customTech||'')+
      FI('lw-focus','Focus Area / Question',data.focusArea||'','text','What are we looking for?')+
      G2(FTA('lw-str','Strengths',data.strengths||''),FTA('lw-afd','Areas for Development',data.afd||''))+
      `<div class="form-group">
        <label class="form-label">📎 Evidence — Photos & Videos <span style="font-weight:400;color:var(--muted)">(add once the walk is complete)</span></label>
        <div class="text-xs text-muted mb-1">Photos (max 4MB each)</div>
        <input type="file" accept="image/*" multiple id="lw-media-image-file">
        <div id="lw-media-images-wrap" class="flex gap-2 mt-2" style="flex-wrap:wrap">${_lwImgs.map(lwImgChip).join('')}</div>
        <div class="text-xs text-muted mb-1" style="margin-top:8px">Videos (max 20MB each)</div>
        <input type="file" accept="video/*" multiple id="lw-media-video-file">
        <div id="lw-media-videos-wrap" class="flex gap-2 mt-2" style="flex-wrap:wrap">${_lwVids.map(lwVidChip).join('')}</div>
      </div>`,
      `<button class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-success" data-save-lw>${isEdit?'Update Walk':'Save Walk'}</button>`
    );
  }

  if(type==='cpd'){
    const isCpdEdit=!!(data.id);
    const _cpdAud=parseCpdAudience(data.audience||'Whole School');
    const cpdPill=(cls,val,label,checked)=>`<label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--light);border:1px solid var(--border);border-radius:14px;padding:4px 10px;cursor:pointer">
      <input type="checkbox" class="${cls}" value="${esc(val)}" ${checked?'checked':''}> ${esc(label)}</label>`;
    const cpdPersonChip=(nm)=>`<span class="badge badge-blue cpd-aud-person" data-name="${esc(nm)}" style="gap:5px">${esc(nm)} <span style="cursor:pointer;font-weight:700" onclick="this.closest('.cpd-aud-person').remove()">✕</span></span>`;
    const _cpdImgs=window.__cpdMediaImages||[];
    const _cpdVids=window.__cpdMediaVideos||[];
    const cpdImgChip=(src,idx)=>`<span class="cpd-media-img-item" style="position:relative;display:inline-block"><img src="${src}" style="max-height:90px;border-radius:6px;border:1px solid var(--border)"><button type="button" class="btn btn-ghost btn-sm" style="position:absolute;top:-8px;right:-8px;background:#fff;border-radius:50%;padding:0 5px;line-height:18px" onclick="removeCpdMediaImage(${idx})">✕</button></span>`;
    const cpdVidChip=(src,idx)=>`<span class="cpd-media-vid-item" style="position:relative;display:inline-block"><video src="${src}" controls style="max-height:100px;max-width:160px;border-radius:6px;border:1px solid var(--border)"></video><button type="button" class="btn btn-ghost btn-sm" style="position:absolute;top:-8px;right:-8px;background:#fff;border-radius:50%;padding:0 5px;line-height:18px" onclick="removeCpdMediaVideo(${idx})">✕</button></span>`;
    return M((isCpdEdit?'✏ Edit':'📚 New')+' CPD Session',
      FI('cpd-title','Session Title',data.title||'','text','e.g. AFL Workshop — Biology Dept')+
      G2(FI('cpd-date','Date',data.date||new Date().toISOString().split('T')[0],'date'),FI('cpd-fac','Facilitator',data.facilitator||userName))+
      G2(FI('cpd-time-from','Time From (optional)',data.timeFrom||'','time'),FI('cpd-time-to','Time To (optional)',data.timeTo||'','time'))+
      FI('cpd-venue','Venue / Place (optional)',data.venue||'','text','e.g. School Hall / Room 12 / Online — leave blank for TBC')+
      `<div class="form-group">
        <label class="form-label">Target Audience <span style="font-weight:400;color:var(--muted)">— select one or more, or search for specific people (e.g. an HOD by name)</span></label>
        <div class="flex gap-2 mb-2" style="flex-wrap:wrap">
          ${cpdPill('cpd-aud-scope-cb','Whole School','🏫 Whole School',_cpdAud.scopes.includes('Whole School'))}
          ${cpdPill('cpd-aud-scope-cb','Girls Section','👧 Girls Section',_cpdAud.scopes.includes('Girls Section'))}
          ${cpdPill('cpd-aud-scope-cb','Boys Section','👦 Boys Section',_cpdAud.scopes.includes('Boys Section'))}
          ${cpdPill('cpd-aud-scope-cb','HOD Team','👥 HOD Team',_cpdAud.scopes.includes('HOD Team'))}
        </div>
        <div class="text-xs text-muted mb-1" style="font-weight:600">By stage</div>
        <div class="flex gap-2 mb-2" style="flex-wrap:wrap">${CPD_AUD_STAGE_SCOPES.map(s=>cpdPill('cpd-aud-scope-cb',s,'🎒 '+s,_cpdAud.scopes.includes(s))).join('')}</div>
        <div class="text-xs text-muted mb-1" style="font-weight:600">By department</div>
        <div class="flex gap-2 mb-2" style="flex-wrap:wrap">${DEPTS.map(d=>cpdPill('cpd-aud-dept-cb',d,d,_cpdAud.depts.includes(d))).join('')}</div>
        <div class="text-xs text-muted mb-1" style="font-weight:600">Specific people</div>
        <div style="position:relative">
          <input class="form-control rtl" id="cpd-aud-search-txt" autocomplete="off" placeholder="🔍 Search staff by name (e.g. an HOD) to add them…">
          <div class="teacher-ac-list" id="cpd-aud-search-txt-list" style="display:none;position:absolute;z-index:50;background:#fff;border:1px solid var(--border);border-radius:6px;box-shadow:0 4px 14px rgba(0,0,0,.15);max-height:190px;overflow-y:auto;width:100%;margin-top:2px"></div>
        </div>
        <div id="cpd-aud-people" class="flex gap-1 mt-2" style="flex-wrap:wrap">${_cpdAud.people.map(cpdPersonChip).join('')}</div>
      </div>`+
      G2(FS('cpd-month','Month',MONTHS,data.month||MONTHS[new Date().getMonth()]||MONTHS[0]),
         FS('cpd-type','Type',['Internal','External','Cambridge','COBIS','WLC','Other'],data.type||'Internal'))+
      FS('cpd-del','Delivery',['Workshop','WLC','Course','Online','Face to Face','In School','Other'],data.delivery||'Workshop')+
      techSelector('cpd-tech','cpd-custom-tech',data.customTech?'Other':(data.bio||''),data.customTech||'')+
      G2(FTA('cpd-bef','Before — Planned outcomes',data.before||''),FTA('cpd-dur','During — Activities',data.during||''))+
      FTA('cpd-aft','After — Implementation & monitoring',data.after||'')+
      `<div class="form-group">
        <label class="form-label">📎 Evidence — Photos & Videos <span style="font-weight:400;color:var(--muted)">(add once the session is complete)</span></label>
        <div class="text-xs text-muted mb-1">Photos (max 4MB each)</div>
        <input type="file" accept="image/*" multiple id="cpd-media-image-file">
        <div id="cpd-media-images-wrap" class="flex gap-2 mt-2" style="flex-wrap:wrap">${_cpdImgs.map(cpdImgChip).join('')}</div>
        <div class="text-xs text-muted mb-1" style="margin-top:8px">Videos (max 20MB each)</div>
        <input type="file" accept="video/*" multiple id="cpd-media-video-file">
        <div id="cpd-media-videos-wrap" class="flex gap-2 mt-2" style="flex-wrap:wrap">${_cpdVids.map(cpdVidChip).join('')}</div>
      </div>`,
      `<button class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-success" data-save-cpd>${isCpdEdit?'Update Session':'Save Session'}</button>`
    );
  }

  if(type==='trip'){
    const isTripEdit=!!(data.id);
    return M((isTripEdit?'✏ Edit':'🎯 New')+' Coaching Triplet',
      G2(FI('tr-name','Session Name',data.name||'','text','e.g. Term 1 Cycle 1'),
         FS('tr-gid','TLC Group',[{v:'',l:'— Select Group —'},...S.groups.map(g=>({v:g.id,l:g.name}))],data.gid||''))+
      G2(FS('tr-cycle','Cycle',[{v:1,l:'Cycle 1'},{v:2,l:'Cycle 2'},{v:3,l:'Cycle 3'}],data.cycle||1),
         FS('tr-status','Status',['planned','active','complete'],data.status||'planned'))+
      G2(FT('tr-oid','Observer (Teacher being observed)',data.oid||''),
         FT('tr-cid','Coach',data.cid||''))+
      FT('tr-fid','Facilitator',data.fid||'')+
      techSelector('tr-tech','tr-custom-tech',data.customTech?'Other':(data.bio||''),data.customTech||'')+
      G2(FI('tr-od','Observe Date',data.od||'','date'),FI('tr-dd','CARE Debrief Date',data.dd||'','date'))+
      `<div class="form-group"><label class="form-label">📝 Observation Script — what to capture</label>
      <div style="display:flex;flex-direction:column;gap:4px;background:var(--light);border:1px solid var(--border);border-radius:6px;padding:8px 10px">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer"><input type="checkbox" class="tr-script-cb" value="quotes" ${(data.scriptChecklist||[]).includes('quotes')?'checked':''}> Verbatim student quotes (3+)</label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer"><input type="checkbox" class="tr-script-cb" value="moves" ${(data.scriptChecklist||[]).includes('moves')?'checked':''}> Teacher moves (questioning, wait time, CFU)</label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer"><input type="checkbox" class="tr-script-cb" value="evidence" ${(data.scriptChecklist||[]).includes('evidence')?'checked':''}> Evidence of technique in action</label>
      </div></div>`+
      FTA('tr-script-text','Script Notes (verbatim quotes, moves, evidence)',data.scriptText||'',5)+
      G2(FTA('tr-www','What Went Well (WWW)',data.wwwNotes||''),FTA('tr-ebi','Even Better If (EBI)',data.ebiNotes||''))+
      FTA('tr-action','Steplab Action Step',data.action||''),
      `<button class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-success" data-save-trip>${isTripEdit?'Update Triplet':'Save Triplet'}</button>`
    );
  }

  if(type==='tlc'){
    const isTlcEdit=!!(data.id);
    const selDepts=data.depts||[];
    const pillCb=(cls,val,label,checked)=>`<label style="display:inline-flex;align-items:center;gap:4px;font-size:12px;background:var(--light);border:1px solid var(--border);border-radius:14px;padding:4px 10px;cursor:pointer">
      <input type="checkbox" class="${cls}" value="${esc(val)}" ${checked?'checked':''}> ${esc(label)}</label>`;
    return M((isTlcEdit?'✏ Edit':'🤝 New')+' Department TLC Session',
      `<div class="form-group"><label class="form-label">Departments Working Together</label>
      <div class="flex gap-2" style="flex-wrap:wrap">${DEPTS.map(d=>pillCb('tlc-dept-cb',d,d,selDepts.includes(d))).join('')}</div></div>`+
      FI('tlc-fac','Facilitator (e.g. HOD, or type any name)',data.facilitator||'','text','e.g. Head of Mathematics')+
      G2(FI('tlc-from','Date From',data.dateFrom||'','date'),FI('tlc-to','Date To',data.dateTo||'','date'))+
      FTA('tlc-app-content','Application (Focused Content)',data.appContent||'',2)+
      FTA('tlc-collab','Collaboration',data.collaboration||'',2)+
      FTA('tlc-active','Active Learning',data.activeLearning||'',2)+
      `<div class="form-group"><label class="form-label">3-2-1 Reflection Ticket</label></div>`+
      FTA('tlc-learned','3️⃣ Things Learned',data.learned||'',2)+
      FTA('tlc-strategies','2️⃣ Strategies to Try',data.strategies||'',2)+
      FTA('tlc-commitment','1️⃣ Commitment for Next Week',data.commitment||'',2)+
      `<div class="form-group"><label class="form-label">Group Artifact (photo or scan)</label>
      <input type="file" accept="image/*" id="tlc-artifact-file">
      <div id="tlc-artifact-preview-wrap" style="margin-top:6px">${data.artifactImage?`<img src="${data.artifactImage}" style="max-height:120px;border-radius:6px;border:1px solid var(--border)"><br><button type="button" class="btn btn-ghost btn-sm mt-1" onclick="window.__tlcArtifactData='';document.getElementById('tlc-artifact-preview-wrap').innerHTML=''">Remove photo</button>`:''}</div></div>`+
      FTA('tlc-focus-feed','Focus Feed into Coaching Triplet <span style="color:#dc2626">*required</span>',data.focusFeed||'',3),
      `<button class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-success" data-save-tlc>${isTlcEdit?'Update Session':'Save Session'}</button>`
    );
  }

  if(type==='dbDebugSched'){
    const rows=data.rows||[];
    const realCpdIds=new Set(data.cpdIds||[]);
    const _cpdGroups={};
    rows.forEach(r=>{ if(r.cpd_id){ (_cpdGroups[r.cpd_id]=_cpdGroups[r.cpd_id]||[]).push(r); } });
    const _dupCount=Object.values(_cpdGroups).filter(g=>g.length>1).reduce((s,g)=>s+g.length-1,0);
    const _orphanCount=rows.filter(r=>r.cpd_id&&!realCpdIds.has(r.cpd_id)).length;
    const _linkedCpdIds=new Set(rows.filter(r=>r.cpd_id).map(r=>r.cpd_id));
    const _missingCpds=(data.cpdRows||[]).filter(c=>!_linkedCpdIds.has(c.id));
    return M('🛠 Raw schedule_rows in Supabase ('+rows.length+')',
      `<p style="font-size:12px;color:var(--muted);margin-bottom:8px">This is a live, unfiltered read straight from the database — no local cache, no seed logic. If duplicates show here, they are genuinely in Supabase. Force-deleting shows the raw HTTP response so we can see exactly what happens.</p>
      <p style="font-size:10px;color:#9ca3af;font-family:monospace;margin-bottom:8px">build: ${BUILD_VERSION}</p>
      ${_missingCpds.length>0?`<div class="alert alert-warn" style="margin-bottom:8px;font-size:12px">⚠️ ${_missingCpds.length} CPD session(s) exist with NO Annual Schedule row at all — this is why they don't show up in the schedule or its CSV export: ${_missingCpds.map(c=>esc(c.title||'(untitled)')).join(', ')}. <button class="btn btn-danger btn-sm" style="margin-left:6px" onclick="backfillMissingCpdScheduleLinks()">🩹 Backfill missing links</button></div>`:''}

      `<button class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-success" data-save-teacher>${isTchEdit?'Update Teacher':'Save Teacher'}</button>`

  if(type==='bulkTeachers'){

      `<button class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-success" data-save-bulk-teachers>Add Teachers</button>`
    );
  }

  if(type==='genTeachers'){
    const existingTeacherIds=new Set(getAllUsers().filter(u=>u.role==='teacher'&&u.teacherId).map(u=>u.teacherId));

    if(S.genTeacherSearch&&S.genTeacherSearch.trim()){
      const q=S.genTeacherSearch.toLowerCase();
      avail=avail.filter(t=>t.name.toLowerCase().includes(q));
    }
    return M('🧑‍🏫 Generate Teacher Accounts',
      `<p style="font-size:12px;color:var(--muted);margin-bottom:10px">Pick teachers below and a username + password will be generated automatically for each — no need to type them one by one. Only teachers without an existing account are shown.</p>
      <div class="flex items-center gap-2 mb-2" style="flex-wrap:wrap">
        <div class="pill-opt ${gd.length===0?'sel':''}" onclick="S.genTeacherDepts=[];render()">All</div>
        ${DEPTS.map(d=>`<div class="pill-opt ${gd.includes(d)?'sel':''}" onclick="const i=S.genTeacherDepts.indexOf('${d}');if(i>=0)S.genTeacherDepts.splice(i,1);else S.genTeacherDepts.push('${d}');render()">${d}</div>`).join('')}
      </div>
      <input class="form-control mb-2" id="gen-teacher-search" placeholder="🔍 Search name…" value="${esc(S.genTeacherSearch||'')}">
      <div class="flex justify-between items-center mb-2">
        <label style="font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer"><input type="checkbox" id="gen-select-all"> Select all filtered (${avail.length})</label>
      </div>
      <div style="max-height:280px;overflow-y:auto;border:1px solid var(--border);border-radius:6px">
      ${avail.length?avail.map(t=>`<label style="display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid #f1f1f1;font-size:12.5px;cursor:pointer">
        <input type="checkbox" class="gen-teacher-cb" value="${t.id}"> ${esc(t.name)} <span class="badge badge-blue" style="font-size:9px">${esc(t.dept)}</span>
      </label>`).join(''):'<div style="padding:16px;text-align:center;color:var(--muted);font-size:12px;font-style:italic">No teachers available (either none match the filter, or all already have accounts).</div>'}
      </div>`,
      `<button class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-success" data-gen-teacher-accounts>Generate Accounts</button>`
    );

  if(type==='genTeachersResult'){
    const created=data.created||[];
    return M('✅ Teacher Accounts Created',
      `<p style="font-size:12px;color:var(--muted);margin-bottom:10px">Share these credentials with each teacher. These accounts are already saved to the database — you can also print or copy every teacher's login anytime from Settings → 🖨 Print Teacher Logins.</p>
      <table style="width:100%;font-size:12px;border-collapse:collapse">
        <thead><tr><th style="text-align:left;padding:6px;border-bottom:2px solid var(--border)">Name</th><th style="text-align:left;padding:6px;border-bottom:2px solid var(--border)">Username</th><th style="text-align:left;padding:6px;border-bottom:2px solid var(--border)">Password</th></tr></thead>
        <tbody>${created.map(u=>`<tr><td style="padding:6px;border-bottom:1px solid #f1f1f1">${esc(u.name)}</td><td style="padding:6px;border-bottom:1px solid #f1f1f1;font-family:monospace">${esc(u.username)}</td><td style="padding:6px;border-bottom:1px solid #f1f1f1;font-family:monospace">${esc(u.password)}</td></tr>`).join('')}</tbody>
      </table>`,
      `<button class="btn btn-ghost" onclick="printTeacherCredentials()">🖨 Print</button><button class="btn btn-primary" data-close-modal>Done</button>`
    );

  if(type==='user'){

      G2(FI('u-name','Full Name',data.name||''),FI('u-user','Username',data.username||''))+
      G2(FI('u-pass',isUserEdit?'New Password (leave blank to keep)':'Password','','password'),
         FS('u-role','Role',[...Object.entries(S.roleCfg).map(([k,r])=>({v:k,l:r.label||k}))],data.role||'viewer'))+
      `<div class="form-group"><label class="form-label">Departments — for Department Coordinator roles (hold Ctrl/Cmd to multi-select)</label>
       <select class="form-control" id="u-depts" multiple style="height:72px">${DEPTS.map(d=>`<option value="${d}" ${(data.depts||[]).includes(d)?'selected':''}>${d}</option>`).join('')}</select></div>`+
      `<div class="form-group"><label class="form-label">Sections — leave blank for all; for a Head of Section, this is which section (Boys/Girls) they're responsible for</label>

      `<div class="form-group"><label class="form-label">Grades — for a Head of Section (HOS): which grades they're responsible for (select one or more; leave blank for no grade restriction)</label>
       <div class="flex gap-2" style="flex-wrap:wrap">${GRADES.map(g=>`<label style="display:flex;align-items:center;gap:4px;font-size:12px;cursor:pointer;background:var(--light);border-radius:5px;padding:3px 8px"><input type="checkbox" class="u-grade-cb" value="${g}" ${(data.grades||[]).includes(g)?'checked':''}> ${g}</label>`).join('')}</div></div>`+
      (isUserEdit?`<input type="hidden" id="u-edit-id" value="${esc(data.id||'')}">` :''),
      `<button class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-success" data-save-user>${isUserEdit?'Update User':'Save User'}</button>`
    );

    const lvl=data.level||'1';
    return M('📈 Add Impact Entry',
      FS('imp-level','Level',[{v:'1',l:'L1: Teacher Knowledge'},{v:'2',l:'L2: Classroom Practice'},{v:'3',l:'L3: Student Outcomes'}],lvl)+
      FS('imp-type','Type',(typeOpts[lvl]||typeOpts[1]),'')+
      G2(FT('imp-tid','Teacher (optional)',data.tid||''),
         FI('imp-val','Value / Score','','text','e.g. 3.8/5'))+
      G2(FI('imp-date','Date',new Date().toISOString().split('T')[0],'date'),FI('imp-term','Term','','text','e.g. Term 1'))+

      cols.map(c=>FI('pr-sc-'+c.replace(/ /g,'_'),'Score: '+c,'','number')).join('')+

  if(type==='dlw'){

    return M((isEdit?'✏ Edit':'🎯 New')+' Domain-Focused Learning Walk',

      FT('dlw-tid','Teacher (optional)',data.tid||'')+
      `<div class="form-group"><label class="form-label">Observation Domain</label>

      }).join('')+

      G2(FTA('dlw-str','Strengths observed'),FTA('dlw-afd','Areas for development')),
      `<button class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-success" data-save-dlw>${isEdit?'Update Walk':'Save Walk'}</button>`
    );
  }

  if(type==='role'){

    return M(title,
