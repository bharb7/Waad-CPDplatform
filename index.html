      FI('role-key','Role key (no spaces)',editKey&&!isBuiltIn?editKey:editKey,'text',editKey?'':'e.g. hod_math')+
      FI('role-label','Display label',existing?.label||'','text','e.g. Head of Mathematics')+
      `<div class="form-group"><label class="form-label">Accessible Views</label>
       <div style="display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--light);padding:10px;border-radius:6px">${viewChecks}</div></div>`+
      `<div class="flex gap-4 mt-2">
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer"><input type="checkbox" id="role-canedit" ${existing?.canEdit!==false?'checked':''}> Can edit data</label>
        <label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer"><input type="checkbox" id="role-scoped" ${existing?.scoped?'checked':''}> Scoped — restrict each user of this role to only their assigned Department(s), or their assigned Grade(s)/Section (set per-user on the Edit User screen)</label>
      </div>`+
      (editKey?`<input type="hidden" id="role-editkey" value="${editKey}">`:''),
      `<button class="btn btn-ghost" data-close-modal>Cancel</button><button class="btn btn-success" data-save-role>${editKey?'Update Role':'Save Role'}</button>`
    );
  }
  if(type==='care'){
    const tabs=['overview','templates','examples','reflection','criteria','resources'];
    const tLabels={overview:'Overview',templates:'Templates',examples:'Examples',reflection:'Reflection Qs',criteria:'Success Criteria',resources:'Resources'};
    const CARE_CONTENT={
      overview:`CARE Coaching Protocol — Waad Academy

1. CLARIFY — Coach asks clarifying questions. No judgement yet. (5 min)
2. ASK & LISTEN — 'What went well?' Teacher reflects first. (8 min)
3. REINFORCE — Specific evidence-based positive feedback. (4 min)
4. ESTABLISH — Co-construct 1 action step. Follow-up date agreed. (3 min)

Total: 20 minutes. One criterion only. One action step.`,
      templates:`OBSERVATION SCRIPT:
□ Date / Teacher / Domain / Biol-Og technique
□ Verbatim student quotes (3+)
□ Teacher moves (questioning, wait time, CFU)
□ Evidence of technique

DEBRIEF TEMPLATE:
□ WWW: 2 specific observable strengths
□ EBI: 1 precise actionable next step
□ Action: [teacher] will [technique] in [lesson] by [date]
□ Steplab micro-prompt: set before leaving room`,
      examples:`EXAMPLE — Think, Pair, Share:
WWW: 'All 27 students generated written responses during Think — 100% engagement'
EBI: 'During Pair, students needed sentence starters'
Action: Add sentence starter card for next TPS lesson by 15 Oct`,
      reflection:`1. What did students know at the end that they couldn't at the start?
2. Where was pupil thought ratio highest?
3. What would you change if you taught this again?
4. How did the Biol-Og technique change engagement?
5. What evidence do you have that learning happened?`,
      criteria:`✓ Observer scripts evidence for 25+ min
✓ Debrief follows CARE — teacher speaks first
✓ Exactly 1 specific observable action step
✓ Action step in Steplab before leaving room
✓ Follow-up date in calendar before leaving room
✓ Roles rotate every cycle`,
      resources:`• Biol-Og CPD Booklets: https://biol-og.com/cpd-booklets/
• Darling-Hammond (2017): learningpolicyinstitute.org
• EEF (2021) 14 Mechanisms: educationendowmentfoundation.org.uk
• Steplab: https://steplab.co
• NEASC ACE: neasc.org`
    };
    const curTab=S.careTab||'overview';
    const body=`<div class="tabs mb-3">${tabs.map(t=>`<button class="tab ${curTab===t?'active':''}" data-care-tab="${t}">${tLabels[t]}</button>`).join('')}</div>
      <div style="background:var(--light);border-radius:8px;padding:14px 16px;font-size:13px;color:#444;line-height:1.8;white-space:pre-wrap;max-height:380px;overflow-y:auto">${CARE_CONTENT[curTab]||''}</div>`;
    return M('📖 Coaching Triplet Protocol — CARE Framework',body,'<button class="btn btn-primary" data-close-modal>Close</button>');
  }

  return M('Modal','<p>Coming soon</p>','<button class="btn btn-ghost" data-close-modal>Close</button>');
}

// ═══ EVENT BINDING ════════════════════════════════════════════════════════════
const g=(id)=>document.getElementById(id);
const gv=(id)=>(g(id)||{}).value||'';


function bindEvents(){
  // Navigation
  document.querySelectorAll('[data-nav]').forEach(el=>{
    el.onclick=()=>{S.view=el.dataset.nav;render()};
  });
  // Logout
  const lb=g('logout-btn');
  if(lb)lb.onclick=()=>{
    logActivity('Signed out');
    stopHeartbeat();
    S.session=null;sset('session',null);render()
  };
  // Login
  const loginBtn=g('l-btn');
  if(loginBtn){
    const doLogin=async()=>{
      const u=(gv('l-user')||'').trim();
      const p=(gv('l-pass')||'').trim();
      const err=g('l-err');
      const found=getAllUsers().find(x=>x.username.toLowerCase()===u.toLowerCase()&&x.password===p);
      if(found){const sess={name:found.fullName||found.name||found.username,role:found.role||'viewer',depts:found.depts||[],sections:found.sections||[],grades:found.grades||[]};S.session=sess;sset('session',sess);
        // Teacher role goes directly to their portal
        if(found.role==='teacher')S.view='myportal';
        logActivity('Signed in');
        startHeartbeat();
        updateOnlinePresence(false); // show as online immediately, don't wait for the first 30s tick
        // Pull the CURRENT role permissions from Supabase right now, before rendering.
        // Without this, logging in (or an admin switching to another user's account on
        // their own already-open tab to "test" a permission change) would just reuse
        // whatever roleCfg happened to already be sitting in this tab's memory — which
        // proves nothing about what's actually saved on the server. This guarantees every
        // login shows the true, current server-side permissions, not a stale local copy.
        await refreshLivePermissions();
        render();return;}
      if(err){err.style.display='block';err.textContent='Invalid credentials. Please contact your administrator.';}
    };
    loginBtn.onclick=doLogin;
    [g('l-user'),g('l-pass')].forEach(el=>{if(el)el.onkeydown=e=>{if(e.key==='Enter')doLogin();}});
  }
  // Modal triggers
  document.querySelectorAll('[data-modal]').forEach(el=>{

  // ── Generate Teacher Accounts ────────────────────────────────────────────

  // ── Teacher autocomplete (typeahead) inputs ─────────────────────────────
  document.querySelectorAll('.teacher-ac-input').forEach(inp=>{

      const q=inp.value.trim().toLowerCase();

      if(!matches.length){listEl.style.display='none';listEl.innerHTML='';return;}

      document.querySelectorAll('[data-score]').forEach(btn=>{

  if(saveBulkTch)saveBulkTch.onclick=async()=>{
    const fileInput=document.getElementById('bulk-tch-file');
    const file=fileInput&&fileInput.files&&fileInput.files[0];
    const statusEl=document.getElementById('bulk-tch-status');
    if(!file){showToast('Choose a CSV or Excel file first','error');return;}
    const groupId=gv('bulk-tch-group')||S.groups[0]?.id;
    const matchExact=(val,list)=>{if(!val)return'';const v=String(val).trim().toLowerCase();return list.find(x=>x.toLowerCase()===v)||'';};
    saveBulkTch.disabled=true;saveBulkTch.textContent='Reading file…';
    if(statusEl)statusEl.textContent='Reading '+file.name+'…';
    try{
      const fname=file.name.toLowerCase();
      let rows=[];
      if(fname.endsWith('.xlsx')||fname.endsWith('.xls')){
        const XLSX=await loadXLSXLib();
        const buf=await file.arrayBuffer();
        const wb=XLSX.read(buf,{type:'array'});
        const ws=wb.Sheets[wb.SheetNames[0]];
        rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false});
      }else{
        const text=await file.text();
        rows=parseCSV(text);
      }
      // Drop an optional header row (e.g. "Name, Department, Section")
      if(rows.length&&rows[0]&&/^name$/i.test(String(rows[0][0]||'').trim())){
        rows=rows.slice(1);
      }
      const newTeachers=rows.map(r=>({
        id:uid(),
        name:String(r[0]||'').trim(),
        dept:matchExact(r[1],DEPTS),
        section:matchExact(r[2],SECTIONS),
        stage:'',grades:[],groupId
      })).filter(t=>t.name);
      if(!newTeachers.length){
        showToast('No valid rows found in that file — check it has Name in the first column','error');
        saveBulkTch.disabled=false;saveBulkTch.textContent='Add Teachers';
        if(statusEl)statusEl.textContent='';
        return;
      }
      S.teachers=[...S.teachers,...newTeachers];
      save('teachers',S.teachers);
      S.modal=null;
      showToast(newTeachers.length+' teacher'+(newTeachers.length!==1?'s':'')+' added ✓ — edit any of them (✏) to fill in details or allocate Grades');
    }catch(e){
      console.warn('Bulk teacher import failed',e);
      showToast('Could not read that file. For .xlsx this needs an internet connection the first time (to load the Excel reader) — if that keeps failing, try saving it as CSV instead.','error');
      saveBulkTch.disabled=false;saveBulkTch.textContent='Add Teachers';
      if(statusEl)statusEl.textContent='';
    }
  };

// ═══ ACTIVITY LOG & ONLINE PRESENCE ══════════════════════════════════════════
const MAX_LOG=200;
const HEARTBEAT_MS=30000;
let _heartbeatTimer=null;

function logActivity(action,detail=''){
  if(!S.session)return;
  const entry={id:uid(),user:S.session.name,role:S.session.role,action,detail:String(detail||'').slice(0,120),ts:new Date().toISOString()};
  const log=sget('activity_log')||[];
  log.unshift(entry);
  if(log.length>MAX_LOG)log.length=MAX_LOG;
  sset('activity_log',log);
  if(SCHOOL_ID){
    const recent=log.slice(0,50);
    // online_users is no longer piggybacked here — updateOnlinePresence() below owns that field
    // exclusively now (see the comment there for why), so this PATCH only ever touches activity_log.
    fetch(SB_URL+'/rest/v1/schools?id=eq.'+SCHOOL_ID,{method:'PATCH',headers:{...SB_HEADERS,'Prefer':'return=minimal'},body:JSON.stringify({branding:{...(S.branding||{}),activity_log:recent}}),cache:'no-store'}).catch(()=>{});
  }
}

// "Who's online" used to be tracked by: read THIS device's own local (possibly stale) copy of
// online_users, stamp in just this person, then PATCH that whole object over the server's copy.
// If two people were online within the same ~30s window, whichever device's heartbeat happened
// to fire last would silently erase the other person's presence — because it was overwriting
// with its own outdated local snapshot instead of the live server state. That's the same "lost
// update" bug already fixed for Role Permissions (see updateRoleCfg) — same fix here:
// read-fresh-merge-write. Also prunes anyone whose last heartbeat is older than PRESENCE_TTL_MS
// so a crashed/closed tab doesn't stay stuck "online" forever.
const PRESENCE_TTL_MS=90000; // ~3x the 30s heartbeat interval
async function updateOnlinePresence(remove){
  if(!SCHOOL_ID||!S.session)return;
  try{
    const fresh=await sbGet('schools','id=eq.'+SCHOOL_ID+'&select=branding&limit=1');
    if(!fresh||!fresh[0])return;
    const baseBranding=fresh[0].branding||{};
    const online={...(baseBranding.online_users||{})};
    const now=Date.now();
    Object.keys(online).forEach(k=>{
      const e=online[k];
      if(!e||!e.ts||(now-new Date(e.ts).getTime())>PRESENCE_TTL_MS)delete online[k];
    });
    const key=S.session.name;
    if(remove)delete online[key];
    else online[key]={ts:new Date().toISOString(),role:S.session.role};
    S.branding={...(S.branding||{}),...baseBranding,online_users:online};sset('branding',S.branding);sset('online_users',online);
    await fetch(SB_URL+'/rest/v1/schools?id=eq.'+SCHOOL_ID,{method:'PATCH',headers:{...SB_HEADERS,'Prefer':'return=minimal'},body:JSON.stringify({branding:{...baseBranding,online_users:online}}),cache:'no-store'});
    render();
  }catch(e){/* best-effort — presence is non-critical, never blocks the rest of the app */}
}

// Piggybacks on the existing heartbeat to pull fresh Role Permissions from Supabase every
// ~30s while someone is logged in — so when an admin edits what a role (e.g. "CPD Lead") is
// allowed to see/do, everyone already using that role sees it update on their own portal
// without needing to log out and back in. Skipped while a modal is open so it never
// interrupts someone mid-edit.
async function refreshLivePermissions(){
  if(!S.session||!SCHOOL_ID||S.modal)return;
  try{
    const schoolData=await sbGet('schools','id=eq.'+SCHOOL_ID+'&select=branding&limit=1');
    if(schoolData&&schoolData.length){
      const br=schoolData[0].branding||{};
      if(br.roleCfg){
        const merged={...DEFAULT_ROLES,...br.roleCfg};
        if(JSON.stringify(merged)!==JSON.stringify(S.roleCfg)){
          S.roleCfg=merged;sset('roleCfg',S.roleCfg);render();
        }
      }
    }
  }catch(e){/* best-effort — silent */}
}
// Self-healing fix for "I changed a role's permissions and it works on my device but not on
// theirs": that symptom is caused by the OTHER person's browser tab still running an OLDER
// cached copy of this whole page (from before the latest deploy) — refreshLivePermissions()
// above can't help them because their tab is running old code that may not even contain that
// function yet. This check fetches the live page's build marker (bypassing cache) every ~30s;
// if it doesn't match what THIS tab is running, a newer version has been deployed, so we
// auto-reload to pick it up. Skipped while a modal is open so it never interrupts someone
// mid-edit. This makes every future deploy self-propagate to already-open tabs without anyone
// needing to be told to manually hard-refresh.
let _newVersionReloadQueued=false;
async function checkForNewVersion(){
  if(S.modal||_newVersionReloadQueued)return;
  try{
    const r=await fetch(location.pathname+'?_v='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const html=await r.text();
    const m=html.match(/<meta name="app-build" content="([^"]+)"/);
    if(m&&m[1]&&m[1]!==BUILD_VERSION){
      _newVersionReloadQueued=true;
      showToast('A newer version of this app is available — refreshing…');
      setTimeout(()=>location.reload(),1800);
    }
  }catch(e){/* best-effort — silent */}
}
function startHeartbeat(){
  if(_heartbeatTimer)clearInterval(_heartbeatTimer);
  _heartbeatTimer=setInterval(()=>{
    if(!S.session||!SCHOOL_ID)return;
    updateOnlinePresence(false);
    refreshLivePermissions();
    checkForNewVersion();
  },HEARTBEAT_MS);
}

function stopHeartbeat(){
  if(_heartbeatTimer)clearInterval(_heartbeatTimer);
  updateOnlinePresence(true);
}

function getOnlineUsers(){
  const snap=S.branding?.online_users||sget('online_users')||{};
  const now=Date.now();
  return Object.entries(snap).filter(([,v])=>now-new Date(v.ts||0).getTime()<90000).map(([name,v])=>({name,role:v.role,ts:v.ts}));
}

  </div>
</div>
<div class="card">
  <div class="flex justify-between items-center mb-3">
    <div class="card-title" style="margin:0">📋 Activity Log</div>
    <div class="flex gap-2">
      <span class="text-xs text-muted">${log.length} entries (last ${MAX_LOG})</span>

      <span class="text-xs text-muted" style="white-space:nowrap;flex-shrink:0;margin-left:8px">${timeAgo(e.ts)}</span>
    </div>`).join('')}
  </div>
</div>`;
}

  let html='<!DOCTYPE html><html><head><title>Waad Academy — CPD Schedule</title><style>body{font-family:"Segoe UI",sans-serif;padding:24px;font-size:11px;color:#1a1a2e;max-width:1200px;margin:0 auto}h1{color:#1F4E79;font-size:17px;margin:0}.meta{color:#6b7280;font-size:10px;margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid #1F4E79;margin-top:4px}.cat{background:#1F4E79;color:#fff;padding:5px 10px;font-weight:700;font-size:11px;border-radius:4px 4px 0 0;margin-top:14px}table{width:100%;border-collapse:collapse;margin-bottom:4px}th{padding:4px 6px;text-align:left;font-size:10px;font-weight:700;color:#6b7280;background:#f9fafb;border-bottom:2px solid #e5e7eb}td{padding:4px 6px;border-bottom:1px solid #f3f4f6;font-size:10px;vertical-align:top}.pill{display:inline-block;padding:1px 6px;border-radius:8px;font-size:9px;font-weight:600}@media print{button{display:none!important}}</style></head><body>';
  html+='<div style="display:flex;justify-content:space-between;align-items:start"><div><h1>&#127983; Waad Academy — Annual CPD & Training Schedule</h1><div class="meta"><span>'+(mf?'Month: <strong>'+safe(mf)+'</strong> · ':'')+(df||dt?(df?'From '+df:'')+(dt?' → '+dt:'')+' · ':'')+'<strong>'+rows.length+'</strong> programmes</span><span>Printed: '+new Date().toLocaleDateString()+'</span></div></div><button onclick="window.print()" style="padding:5px 12px;background:#1F4E79;color:#fff;border:none;border-radius:6px;font-size:11px;cursor:pointer;margin-top:4px">&#128424; Print</button></div>';

    catRows.forEach(r=>{const sc=scColor(r.status);const sb=scBg(r.status);html+='<tr><td style="font-weight:600">'+safe(r.program)+'</td><td>'+safe(r.facilitator||'—')+'</td><td>'+safe(r.type||'—')+'</td><td>'+safe(r.time||'—')+'</td><td>'+safe(r.duration||'—')+'</td><td>'+safe(r.startDate||'—')+'</td><td>'+safe(r.endDate||'—')+'</td><td>'+safe(r.venue||'—')+'</td><td>'+safe(r.target||'—')+'</td><td>'+safe(r.cost||'—')+'</td><td><span class="pill" style="background:'+sb+';color:'+sc+'">'+safe(r.status)+'</span></td></tr>';});

function exportScheduleExcel(){
  const mf=S.schedMonthFilter||'';const df=S.schedDateFrom||'';const dt=S.schedDateTo||'';
  let rows=S.schedule.slice();
  if(mf)rows=rows.filter(r=>r.month===mf);
  if(df)rows=rows.filter(r=>(r.startDate||'')>=df);
  if(dt)rows=rows.filter(r=>(r.startDate||'')<=dt);
  rows.sort((a,b)=>(a.startDate||'').localeCompare(b.startDate||''));
  const header=['Category','Programme','Facilitator','Type','Delivery','Time','Duration','Start Date','End Date','Month','Venue','Target Audience','Cost','Status'];
  const data=rows.map(r=>[r.category||'',r.program||'',r.facilitator||'',r.type||'',r.delivery||'',r.time||'',r.duration||'',r.startDate||'',r.endDate||'',r.month||'',r.venue||'',r.target||'',r.cost||'',r.status||'']);
  const filterLabel=[mf?'Month: '+mf:'',df?'From: '+df:'',dt?'To: '+dt:''].filter(Boolean).join(' | ')||'All Programmes';
  const summaryRows=[['Waad Academy — Annual CPD & Training Schedule','','','','','','','','','','','','',''],[ filterLabel,'','Total: '+rows.length,'','','','','','','','','','',''],['Printed: '+new Date().toLocaleDateString(),'','','','','','','','','','','','',''],['','','','','','','','','','','','','',''],header];
  const allRows=[...summaryRows,...data];
  const csv=allRows.map(r=>r.map(v=>{const s=String(v||'').replace(/"/g,'""');return '"'+s+'"';}).join(',')).join('\r\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='Waad-Schedule-'+new Date().toISOString().split('T')[0]+'.csv';a.click();URL.revokeObjectURL(url);
  showToast('Excel file downloaded ✓');
}

// ═══ CSV EXPORT ══════════════════════════════════════════════════════════════
function exportCSV(filename, rows){
  if(!rows||!rows.length)return;
  const keys=Object.keys(rows[0]);
  const csv=[keys.join(','),...rows.map(r=>keys.map(k=>{const v=String(r[k]||'').replace(/"/g,'""');return '"'+v+'"';}).join(','))].join('\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download=filename;
  a.click();
}
